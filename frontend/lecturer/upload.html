<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Upload Material - Lecturer</title>
    <link rel="stylesheet" href="../shared/variables.css">
    <link rel="stylesheet" href="../shared/reset.css">
    <link rel="stylesheet" href="../shared/typography.css">
    <link rel="stylesheet" href="../shared/responsive.css">
    <link rel="stylesheet" href="../shared/profile-popup.css">
    <link rel="stylesheet" href="../shared/spinner.css">
    <link rel="stylesheet" href="../shared/sidebar.css">
    <link rel="stylesheet" href="../shared/dropdown.css">
    <link rel="stylesheet" href="dashboard.css">
    <link rel="stylesheet" href="upload.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Outfit:wght@700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <script src="../shared/theme.js"></script>
</head>
<body>
    <div class="dashboard-container">
        <aside class="sidebar" id="app-sidebar"></aside>

        <main class="main-content">
            <header class="top-bar">
                <div class="top-bar-title">
                    <div class="title-row">
                        <h1>Upload Lecture Material</h1>
                        <div class="user-profile">
                            <div class="avatar" id="user-avatar" title="Profile & settings">L</div>
                        </div>
                    </div>
                </div>
            </header>

            <section class="upload-section">
                <div class="stat-card">
                    <form id="upload-form">
                        <div class="form-group">
                            <label class="form-label" for="course-select">Select Course</label>
                            <select id="course-select" class="form-input" data-dropdown required>
                                <option value="" disabled selected>Loading courses...</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label class="form-label" for="academic-year">Academic Year</label>
                            <select id="academic-year" class="form-input" data-dropdown required>
                                <option value="" disabled selected>Loading years...</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label class="form-label" for="semester">Semester</label>
                            <select id="semester" class="form-input" data-dropdown required>
                                <option value="" disabled selected>Select semester</option>
                                <option value="First Semester">First Semester</option>
                                <option value="Second Semester">Second Semester</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label class="form-label" for="title">Material Title</label>
                            <input type="text" id="title" class="form-input" placeholder="e.g. Introduction to SQL" required>
                        </div>
                        <div class="form-group">
                            <label class="form-label" for="description">Description</label>
                            <textarea id="description" class="form-input" rows="4" placeholder="Optional brief description"></textarea>
                        </div>
                        <div class="form-group">
                            <label class="form-label">Organization</label>
                            <div class="org-options" role="radiogroup" aria-label="Material organization">
                                <label class="org-option"><input type="radio" name="organization" value="week" checked><span>Week by week</span></label>
                                <label class="org-option"><input type="radio" name="organization" value="unit"><span>Unit / part</span></label>
                                <label class="org-option"><input type="radio" name="organization" value="full"><span>Whole semester</span></label>
                            </div>
                            <div class="org-field" id="org-week-field">
                                <input type="number" id="week-number" class="form-input" min="1" placeholder="e.g. 3 — the week this material belongs to">
                            </div>
                            <div class="org-field" id="org-unit-field" hidden>
                                <input type="text" id="unit-label" class="form-input" placeholder="e.g. Unit 1 - Introduction, or Part 2">
                            </div>
                            <p class="form-hint" id="org-hint">Materials are shown to students grouped under this week, unit, or the whole course.</p>
                        </div>

                        <div class="form-group">
                            <label class="form-label" for="file">Upload File</label>
                            <div class="drop-zone" id="drop-zone" role="button" tabindex="0"
                                 aria-describedby="file-hint file-error">
                                <input type="file" id="file" class="drop-zone__input"
                                       accept=".pdf,.doc,.docx,.ppt,.pptx,.xls,.xlsx,.odt,.odp,.ods,.png,.jpg,.jpeg,.gif,.webp"
                                       required hidden>
                                <div class="drop-zone__content" id="drop-zone-content">
                                    <i class="bi bi-cloud-arrow-up drop-zone__icon"></i>
                                    <p class="drop-zone__label">Drag and drop your file here</p>
                                    <p class="drop-zone__sub">or <span class="drop-zone__browse">choose from folder</span></p>
                                </div>
                            </div>
                            <p class="form-hint" id="file-hint">PDF, DOCX, PPTX, XLSX, PNG, JPG — max 50 MB</p>
                            <p class="file-error" id="file-error" role="alert" hidden></p>
                        </div>

                        <div class="file-preview" id="file-preview" hidden>
                            <div class="file-preview__card">
                                <i class="bi file-preview__icon" id="file-preview-icon"></i>
                                <div class="file-preview__info">
                                    <span class="file-preview__name" id="file-preview-name"></span>
                                    <span class="file-preview__size" id="file-preview-size"></span>
                                </div>
                                <button type="button" class="file-preview__remove" id="file-preview-remove"
                                        aria-label="Remove file" title="Remove file">
                                    <i class="bi bi-x-lg"></i>
                                </button>
                            </div>
                        </div>

                        <div class="upload-progress" id="upload-progress" hidden>
                            <div class="upload-progress__bar-track">
                                <div class="upload-progress__bar-fill" id="upload-progress-fill"></div>
                            </div>
                            <p class="upload-progress__text" id="upload-progress-text">Uploading…</p>
                        </div>

                        <button type="submit" class="btn-auth btn-full" id="upload-submit">Upload Material</button>
                    </form>
                </div>
            </section>
        </main>
    </div>

    <!-- Upload-another modal -->
    <div id="upload-again-modal" class="modal" hidden>
        <div class="modal-card">
            <div class="modal-head">
                <h3>Material uploaded</h3>
                <button class="modal-close" id="upload-again-close" aria-label="Close">&times;</button>
            </div>
            <p class="text-muted">Upload another file to the same course?</p>
            <div class="modal-actions">
                <button class="btn-secondary" id="upload-again-dashboard">Back to dashboard</button>
                <button class="btn-primary" id="upload-again-yes">Upload another</button>
            </div>
        </div>
    </div>

    <!-- Live region for screen reader announcements -->
    <div id="upload-live" class="sr-only" aria-live="polite" aria-atomic="true"></div>

    <script src="../shared/sidebar.js"></script>
    <script src="../shared/api-cache.js"></script>
    <script src="../shared/session.js"></script>
    <script src="../shared/profile-popup.js"></script>
    <script src="../shared/toast.js"></script>
    <script src="../shared/dropdown.js"></script>
    <script src="upload.js"></script>
</body>
</html>
