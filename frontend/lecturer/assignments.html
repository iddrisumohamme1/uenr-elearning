<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assignments - Lecturer</title>
    <link rel="stylesheet" href="../shared/variables.css">
    <link rel="stylesheet" href="../shared/reset.css">
    <link rel="stylesheet" href="../shared/typography.css">
    <link rel="stylesheet" href="../shared/responsive.css">
    <link rel="stylesheet" href="../shared/profile-popup.css">
    <link rel="stylesheet" href="../shared/spinner.css">
    <link rel="stylesheet" href="../shared/sidebar.css">
    <link rel="stylesheet" href="../shared/dropdown.css">
    <link rel="stylesheet" href="dashboard.css">
    <link rel="stylesheet" href="assignments.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Outfit:wght@700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <script src="../shared/theme.js"></script>
</head>
<body>
    <div class="dashboard-container">
        <aside class="sidebar" id="app-sidebar"></aside>

        <main class="main-content">
            <header class="top-bar">
                <h1>Assignments</h1>
                <p class="text-muted">Set assignments for your courses and review on-time submissions.</p>
            </header>

            <section class="create-panel fade-in-up">
                <div class="panel-head">
                    <h3>Create Assignment</h3>
                    <p class="text-muted panel-sub">Students can submit text answers; on-time status is tracked automatically</p>
                </div>
                <form id="assign-form" class="assign-form">
                    <div class="form-grid">
                        <div class="form-group">
                            <label class="form-label">Course</label>
                            <select id="course-select" class="form-input" data-dropdown required>
                                <option value="" disabled selected>Loading courses...</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label class="form-label">Title</label>
                            <input type="text" id="assign-title" class="form-input" placeholder="e.g. Week 3 Problem Set" required>
                        </div>
                        <div class="form-group">
                            <label class="form-label">Due date</label>
                            <input type="date" id="assign-due" class="form-input">
                        </div>
                        <div class="form-group">
                            <label class="form-label">Week number</label>
                            <input type="number" id="assign-week" class="form-input" min="1" placeholder="Optional">
                        </div>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Instructions</label>
                        <textarea id="assign-instructions" class="form-input" rows="3" placeholder="What should students do?"></textarea>
                    </div>
                    <button type="submit" class="btn-auth btn-upload">Create assignment</button>
                </form>
            </section>

            <section class="assign-section fade-in-up">
                <div class="panel-head">
                    <h3>Your Assignments</h3>
                    <p class="text-muted panel-sub">Submissions and on-time rates per assignment</p>
                </div>
                <div id="assign-list">
                    <div class="loading-wrapper loading-full">
                        <div class="spinner"></div>
                        <p>Loading assignments…</p>
                    </div>
                </div>
            </section>
        </main>
    </div>

    <!-- Submissions modal -->
    <div id="subs-modal" class="modal modal-wide" hidden>
        <div class="modal-card">
            <div class="modal-head">
                <h3 id="subs-title">Submissions</h3>
                <button class="modal-close" data-close="true" aria-label="Close">&times;</button>
            </div>
            <div id="subs-body" class="students-body">
                <div class="loading-wrapper loading-full">
                    <div class="spinner"></div>
                    <p>Loading submissions…</p>
                </div>
            </div>
        </div>
    </div>

    <script src="../shared/sidebar.js"></script>
    <script src="../shared/session.js"></script>
    <script src="../shared/profile-popup.js"></script>
    <script src="../shared/toast.js"></script>
    <script src="../shared/dropdown.js"></script>
    <script src="assignments.js"></script>
</body>
</html>
