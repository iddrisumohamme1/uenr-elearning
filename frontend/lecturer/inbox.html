<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inbox - UENR E-Learning</title>
    <link rel="stylesheet" href="../shared/variables.css">
    <link rel="stylesheet" href="../shared/reset.css">
    <link rel="stylesheet" href="../shared/typography.css">
    <link rel="stylesheet" href="../shared/responsive.css">
    <link rel="stylesheet" href="../shared/profile-popup.css">
    <link rel="stylesheet" href="../shared/spinner.css">
    <link rel="stylesheet" href="../shared/sidebar.css">
    <link rel="stylesheet" href="../shared/inbox.css?v=2026-09-05b">
    <link rel="stylesheet" href="dashboard.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <script src="../shared/theme.js"></script>
</head>
<body>
    <div class="dashboard-container">
        <aside class="sidebar" id="app-sidebar"></aside>

        <main class="main-content">
            <header class="top-bar">
                <div class="top-bar-title">
                    <p class="page-eyebrow">Messaging</p>
                    <div class="title-row">
                        <h1>Inbox</h1>
                        <div class="user-profile">
                            <div class="avatar" id="user-avatar" title="Profile & settings"></div>
                        </div>
                    </div>
                </div>
            </header>

            <div class="inbox" id="inbox">
                <!-- Left: conversation list -->
                <div class="inbox-convos">
                    <div class="inbox-convos-head">
                        <span>Conversations</span>
                        <span class="inbox-convos-count" id="convos-count"></span>
                    </div>
                    <div class="inbox-convos-list" id="convos-list">
                        <div class="loading-wrapper loading-full">
                            <div class="spinner"></div>
                            <p>Loading your messages...</p>
                        </div>
                    </div>
                </div>

                <!-- Right: thread + composer -->
                <div class="inbox-thread" id="thread">
                    <div class="inbox-thread-head">
                        <button class="inbox-thread-back" id="thread-back" aria-label="Back to conversations"><i class="bi bi-arrow-left"></i></button>
                        <div class="inbox-thread-avatar" id="thread-avatar"></div>
                        <div class="inbox-thread-info">
                            <div class="inbox-thread-name" id="thread-name"></div>
                            <div class="inbox-thread-meta" id="thread-meta"></div>
                        </div>
                    </div>
                    <div class="inbox-messages" id="thread-messages">
                        <div class="inbox-thread-placeholder">
                            <i class="bi bi-chat-dots"></i>
                            <h3>Select a conversation</h3>
                            <p>Your conversations with students are grouped here.</p>
                        </div>
                    </div>
                    <div class="inbox-composer" id="composer-wrap" style="display:none">
                        <textarea id="composer-input" rows="1" placeholder="Message…"></textarea>
                        <button class="inbox-composer-send" id="composer-send" aria-label="Send" disabled><span class="btn-label"><i class="bi bi-send"></i></span><span class="btn-spinner" hidden></span></button>
                        <span class="inbox-composer-status" id="composer-status" style="display:none"></span>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="../shared/sidebar.js"></script>
    <script src="../shared/api-cache.js"></script>
    <script src="../shared/session.js"></script>
    <script src="../shared/profile-popup.js"></script>
    <script src="../shared/toast.js"></script>
    <script src="inbox.js"></script>
</body>
</html>
