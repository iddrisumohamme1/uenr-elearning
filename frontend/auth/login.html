<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - UENR E-Learning</title>
    <link rel="stylesheet" href="../shared/variables.css">
    <link rel="stylesheet" href="../shared/reset.css">
    <link rel="stylesheet" href="../shared/typography.css">
    <link rel="stylesheet" href="../shared/responsive.css">
    <link rel="stylesheet" href="../shared/spinner.css">
    <link rel="stylesheet" href="auth.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Outfit:wght@700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <script src="../shared/theme.js"></script>
</head>
<body>
    <div class="auth-page">
        <div class="auth-card">
            <div class="auth-header">
                <img class="auth-logo" src="../image/UENR-LOGO.png" alt="UENR Learn logo" />
                <h1 class="auth-title">Welcome </h1>
                <p class="text-muted">Enter your credentials to access your portal</p>
            </div>
            
            <form id="login-form" autocomplete="on">
                <div class="form-group">
                    <label class="form-label" for="email">Email Address</label>
                    <input type="email" class="form-input" id="email" name="email" placeholder="student@uenr.edu.gh" autocomplete="username" required>
                </div>
                
                <div class="form-group">
                    <label class="form-label" for="password">Password</label>
                    <div class="password-wrap">
                        <input type="password" class="form-input" id="password" name="password" placeholder="••••••••" autocomplete="current-password" required>
                        <button type="button" class="password-toggle" aria-label="Show password"><i class="bi bi-eye"></i></button>
                    </div>
                </div>
                
                <button type="submit" class="btn-auth"><span class="btn-label">Sign In</span><span class="btn-spinner" hidden></span></button>
            </form>
            <div class="auth-footer">
                Don't have an account? <a href="register.html" class="auth-link">Register here</a>
            </div>
        </div>
    </div>
    <script src="../shared/session.js"></script>
    <script src="../shared/toast.js"></script>
    <script src="auth.js"></script>
</body>
</html>
