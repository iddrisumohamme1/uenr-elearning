<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - UENR E-Learning</title>
    <link rel="stylesheet" href="../shared/variables.css">
    <link rel="stylesheet" href="../shared/reset.css">
    <link rel="stylesheet" href="../shared/typography.css">
    <link rel="stylesheet" href="../shared/responsive.css">
    <link rel="stylesheet" href="../shared/spinner.css">
    <link rel="stylesheet" href="../shared/dropdown.css">
    <link rel="stylesheet" href="auth.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Outfit:wght@700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <script src="../shared/theme.js"></script>
</head>
<body>
    <div class="auth-page">
        <div class="auth-card">
            <div class="auth-header">
                <img class="auth-logo" src="../image/UENR-LOGO.png" alt="UENR Learn logo" />
                <h1 class="auth-title">Create Account</h1>
                <p class="text-muted">Join the intelligent learning community</p>
            </div>

            <div class="role-grid">
                <div class="role-card active" data-role="student">
                    <span class="role-icon"><i class="bi bi-mortarboard"></i></span>
                    <span class="role-name">STUDENT</span>
                </div>
                <div class="role-card" data-role="lecturer">
                    <span class="role-icon"><i class="bi bi-person-video3"></i></span>
                    <span class="role-name">LECTURER</span>
                </div>
                <div class="role-card" data-role="hod">
                    <span class="role-icon"><i class="bi bi-buildings"></i></span>
                    <span class="role-name">HOD</span>
                </div>
            </div>
            
            <form id="register-form" autocomplete="off">
                <div class="form-group">
                    <label class="form-label" for="fullname">Full Name</label>
                    <input type="text" class="form-input" id="fullname" name="fullname" placeholder="John Doe" autocomplete="off" required>
                    <small class="field-error" id="fullname-error"></small>
                </div>

                <div class="form-group">
                    <label class="form-label" for="email">Email Address</label>
                    <input type="email" class="form-input" id="email" name="email" placeholder="john.doe@uenr.edu.gh" autocomplete="off" required>
                    <small class="field-error" id="email-error"></small>
                </div>
                
                <div class="form-group">
                    <label class="form-label" for="password">Password</label>
                    <div class="password-wrap">
                        <input type="password" class="form-input" id="password" name="password" placeholder="••••••••" autocomplete="new-password" required>
                        <button type="button" class="password-toggle" aria-label="Show password"><i class="bi bi-eye"></i></button>
                    </div>
                    <small class="field-error" id="password-error"></small>
                </div>

                <div class="form-group">
                    <label class="form-label" for="confirm_password">Confirm Password</label>
                    <div class="password-wrap">
                        <input type="password" class="form-input" id="confirm_password" name="confirm_password" placeholder="••••••••" autocomplete="new-password" required>
                        <button type="button" class="password-toggle" aria-label="Show password"><i class="bi bi-eye"></i></button>
                    </div>
                    <small class="field-error" id="confirm_password-error"></small>
                </div>

                <!-- <div class="form-group">
                    <label class="form-label">User ID (optional)</label>
                    <input type="text" class="form-input" id="user_id" name="user_id" placeholder="UEB3503022">
                </div> -->

                <div class="form-group">
                    <label class="form-label" for="department">Department</label>
                    <select id="department" name="department" class="form-input" data-dropdown>
                        <option value="" disabled selected>Select your department</option>
                        <option value="Civil Engineering">Civil Engineering</option>
                        <option value="Computer Engineering">Computer Engineering</option>
                        <option value="Electrical and Electronic Engineering">Electrical and Electronic Engineering</option>
                        <option value="Mechanical Engineering">Mechanical Engineering</option>
                        <option value="Renewable Energy Engineering">Renewable Energy Engineering</option>
                        <option value="Petroleum Engineering">Petroleum Engineering</option>
                        <option value="Environmental Engineering">Environmental Engineering</option>
                        <option value="Agricultural Engineering">Agricultural Engineering</option>
                        <option value="Computer Science">Computer Science</option>
                        <option value="Information Technology">Information Technology</option>
                        <option value="Medical Laboratory Science">Medical Laboratory Science</option>
                        <option value="Nursing">Nursing</option>
                        <option value="Actuarial Science">Actuarial Science</option>
                        <option value="Mathematics and Statistics">Mathematics and Statistics</option>
                        <option value="Biological Science">Biological Science</option>
                        <option value="Biochemistry ">Biochemistry</option>
                        <option value="Chemistry">Chemistry</option>
                        <option value="Natural Resources Management (Forestry, Ecotourism, Fisheries)">Natural Resources Management (Forestry, Ecotourism, Fisheries)</option>
                        <option value="Climate Change and Sustainable Development">Climate Change and Sustainable Development</option>
                        <option value="Sustainable and Development Minerals Mining">Sustainable and Development Minerals Mining</option>
                        <option value="Fire, Safety and Disaster Management">Fire, Safety and Disaster Management</option>
                    </select>
                    <small class="field-error" id="department-error"></small>
                </div>
                <button type="submit" class="btn-auth">Create Account</button>
            </form>
            
            <div class="auth-footer">
                Already have an account? <a href="login.html" class="auth-link">Sign In</a>
            </div>
        </div>
    </div>
    <script src="../shared/session.js"></script>
    <script src="../shared/toast.js"></script>
    <script src="../shared/dropdown.js"></script>
    <script src="auth.js"></script>
</body>
</html>
