<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Courses - UENR E-Learning</title>
    <link rel="stylesheet" href="../shared/variables.css">
    <link rel="stylesheet" href="../shared/reset.css">
    <link rel="stylesheet" href="../shared/typography.css">
    <link rel="stylesheet" href="../shared/responsive.css">
    <link rel="stylesheet" href="../shared/profile-popup.css">
    <link rel="stylesheet" href="../shared/spinner.css">
    <link rel="stylesheet" href="../shared/sidebar.css">
    <link rel="stylesheet" href="courses.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@600;700;800&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <script src="../shared/theme.js"></script>
</head>
<body>
    <div class="courses-container">
        <aside class="sidebar" id="app-sidebar"></aside>

        <main class="courses-content">
            <header class="top-bar">
                <div class="top-bar-title">
                    <p class="page-eyebrow">Your enrolment record</p>
                    <div class="title-row">
                        <h1>My Courses</h1>
                        <div class="user-profile">
                            <div class="avatar" id="user-avatar">U</div>
                        </div>
                    </div>
                </div>
            </header>

            <div class="search-bar">
                <i class="bi bi-search search-icon" aria-hidden="true"></i>
                <input type="text" id="course-search" placeholder="Search by course code, title, or lecturer...">
            </div>

            <div class="tab-bar">
                <button class="tab-btn active" data-tab="enrolled">Enrolled Courses <span class="tab-count">0</span></button>
                <button class="tab-btn" data-tab="all">All Courses <span class="tab-count">0</span></button>
            </div>

            <!-- Level -> Semester -> courses drill-down (All Courses tab) -->
            <div id="browse-nav" class="browse-nav" hidden>
                <button type="button" id="browse-back" class="browse-back" hidden><i class="bi bi-arrow-left" aria-hidden="true"></i></button>
                <div id="browse-trail" class="browse-trail"></div>
                <div id="browse-choices" class="browse-choices"></div>
            </div>

            <div id="courses-grid" class="courses-grid">
                <!-- Courses dynamically loaded -->
                <div class="loading-wrapper loading-full" style="grid-column: 1 / -1;">
                    <div class="spinner"></div>
                    <p>Loading courses...</p>
                </div>
            </div>
        </main>
    </div>

    <!-- Unenroll confirmation -->
    <div id="unenroll-modal" class="modal" hidden>
        <div class="modal-card confirm-card" role="dialog" aria-modal="true" aria-labelledby="unenroll-title">
            <div class="confirm-icon" aria-hidden="true"><i class="bi bi-exclamation-triangle-fill"></i></div>
            <h3 id="unenroll-title">Unenroll from this course?</h3>
            <p class="modal-text">
                You're about to leave <strong id="unenroll-course-name">this course</strong>.
                You'll lose access to its materials and quizzes — you can re-enroll anytime while it's available.
            </p>
            <div class="modal-actions">
                <button type="button" class="btn-ghost" data-close>Cancel</button>
                <button type="button" class="btn-danger-confirm" id="confirm-unenroll-btn"><span class="btn-label">Unenroll</span><span class="btn-spinner" hidden></span></button>
            </div>
        </div>
    </div>

    <script src="../shared/sidebar.js"></script>
    <script src="../shared/api-cache.js"></script>
    <script src="../shared/session.js"></script>
    <script src="../shared/profile-popup.js"></script>
    <script src="../shared/toast.js"></script>
    <script src="courses.js"></script>
</body>
</html>
