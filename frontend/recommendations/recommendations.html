<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recommendations - UENR E-Learning</title>
    <link rel="stylesheet" href="../shared/variables.css">
    <link rel="stylesheet" href="../shared/reset.css">
    <link rel="stylesheet" href="../shared/typography.css">
    <link rel="stylesheet" href="../shared/responsive.css">
    <link rel="stylesheet" href="../shared/profile-popup.css">
    <link rel="stylesheet" href="../shared/spinner.css">
    <link rel="stylesheet" href="../shared/sidebar.css">
    <link rel="stylesheet" href="../shared/dropdown.css">
    <link rel="stylesheet" href="recommendations.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <script src="../shared/theme.js"></script>
</head>
<body>
    <div class="rec-container">
        <aside class="sidebar" id="app-sidebar"></aside>

        <main class="rec-content">
            <header class="top-bar">
                <h1>Recommendations</h1>
                <div class="user-profile">
                    <div class="avatar">R</div>
                </div>
            </header>

            <section class="search-section" aria-label="Search for study resources">
                <h2 class="search-heading"></h2>
                <form id="search-form" class="search-bar" role="search">
                    <i class="bi bi-search search-bar-icon" aria-hidden="true"></i>
                    <input id="weak-concepts" type="search" placeholder="Describe the topic you're struggling with..." autocomplete="off" spellcheck="false" aria-label="Search topics" />
                    <button type="button" id="clear-search" class="search-clear" aria-label="Clear search" title="Clear">
                        <i class="bi bi-x-lg"></i>
                    </button>
                    <button type="submit" id="search-btn" class="search-submit" aria-label="Search">
                        <i class="bi bi-arrow-right-short"></i>
                    </button>
                </form>

                <div id="related-searches" class="related-searches" style="display:none">
                    <span class="related-label">Related searches</span>
                    <div id="related-chips" class="chips-inline"></div>
                </div>
            </section>

            <div id="pending-recs" class="pending-recs" style="display:none">
                <h2 class="pending-title">Recommended for you</h2>
                <p class="text-muted">Based on your recent quiz scores — dive into these before your next attempt.</p>
                <div id="pending-recs-list" class="search-results"></div>
            </div>

            <div id="results-info" class="results-info" style="display:none"></div>

            <div id="loading-state" class="loading-wrapper" style="display:none">
                <div class="spinner"></div>
                <p>Searching for you...</p>
            </div>

            <div id="error-state" class="error-state" style="display:none">
                <p id="error-message">Unable to load recommendations.</p>
            </div>

            <div id="recommendations-list" class="search-results">
                <!-- Recommendations will be loaded here -->
            </div>
        </main>
    </div>
    <script src="../shared/sidebar.js"></script>
    <script src="../shared/api-cache.js"></script>
    <script src="../shared/session.js"></script>
    <script src="../shared/profile-popup.js"></script>
    <script src="../shared/toast.js"></script>
    <script src="../shared/dropdown.js"></script>
    <script src="../shared/tutor-widget.js"></script>
    <script src="recommendations.js"></script>
</body>
</html>
