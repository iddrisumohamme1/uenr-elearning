<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Upload Material - HOD</title>
    <link rel="stylesheet" href="../shared/variables.css">
    <link rel="stylesheet" href="../shared/reset.css">
    <link rel="stylesheet" href="../shared/typography.css">
    <link rel="stylesheet" href="../shared/responsive.css">
    <link rel="stylesheet" href="../shared/profile-popup.css">
    <link rel="stylesheet" href="../shared/spinner.css">
    <link rel="stylesheet" href="../shared/sidebar.css">
    <link rel="stylesheet" href="../shared/dropdown.css">
    <link rel="stylesheet" href="dashboard.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Outfit:wght@700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <script src="../shared/theme.js"></script>
</head>
<body>
    <div class="dashboard-container">
        <aside class="sidebar" id="app-sidebar"></aside>

        <main class="main-content">
            <header class="top-bar">
                <h1>Upload Lecture Material</h1>
                <!-- <p class="text-muted">Upload materials for department courses in your faculty.</p> -->
            </header>

            <section class="upload-section">
                <div class="stat-card">
                    <form id="upload-form">
                        <div class="form-group">
                            <label class="form-label">Course</label>
                            <select id="course-select" class="form-input" data-dropdown required>
                                <option value="" disabled selected>Loading courses...</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label class="form-label">Academic Year</label>
                            <select id="academic-year" class="form-input" data-dropdown required>
                                <option value="" disabled selected>Loading years...</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label class="form-label">Semester</label>
                            <select id="semester" class="form-input" data-dropdown required>
                                <option value="" disabled selected>Select semester</option>
                                <option value="First Semester">First Semester</option>
                                <option value="Second Semester">Second Semester</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label class="form-label">Material Title</label>
                            <input type="text" id="title" class="form-input" placeholder="e.g. Lecture 1 Notes" required>
                        </div>
                        <div class="form-group">
                            <label class="form-label">Description</label>
                            <textarea id="description" class="form-input" rows="4" placeholder="Optional brief description"></textarea>
                        </div>
                        <div class="form-group">
                            <label class="form-label">Organization</label>
                            <div class="org-options" role="radiogroup" aria-label="Material organization">
                                <label class="org-option"><input type="radio" name="organization" value="week" checked><span>Week by week</span></label>
                                <label class="org-option"><input type="radio" name="organization" value="unit"><span>Unit / part</span></label>
                                <label class="org-option"><input type="radio" name="organization" value="full"><span>Whole semester</span></label>
                            </div>
                            <div class="org-field" id="org-week-field">
                                <input type="number" id="week-number" class="form-input" min="1" placeholder="e.g. 3 — the week this material belongs to">
                            </div>
                            <div class="org-field" id="org-unit-field" hidden>
                                <input type="text" id="unit-label" class="form-input" placeholder="e.g. Unit 1 - Introduction, or Part 2">
                            </div>
                            <p class="form-hint" id="org-hint">Materials are shown to students grouped under this week, unit, or the whole course.</p>
                        </div>
                        <div class="form-group">
                            <label class="form-label">Upload File</label>
                            <input type="file" id="file" class="form-input" required>
                        </div>
                        <button type="submit" class="btn-auth btn-upload">Upload Material</button>
                    </form>
                </div>
            </section>
        </main>
    </div>

    <script src="../shared/sidebar.js"></script>
    <script src="../shared/session.js"></script>
    <script src="../shared/profile-popup.js"></script>
    <script src="../shared/toast.js"></script>
    <script src="../shared/dropdown.js"></script>
    <script>
    document.addEventListener('DOMContentLoaded', async () => {
        const user = await requireSession('hod').catch(() => null);
        if (!user) return;

        const courseSelect = document.getElementById('course-select');
        const form = document.getElementById('upload-form');
        const academicYear = document.getElementById('academic-year');

        attachLogout('logout-btn');
        initProfilePopup();

        function loadAcademicYears() {
            const now = new Date().getFullYear();
            const options = [];
            for (let y = now; y >= now - 3; y--) {
                options.push(`<option value="${y}/${y + 1}">${y}/${y + 1}</option>`);
            }
            academicYear.innerHTML = `
                <option value="" disabled selected>Select academic year</option>
                ${options.join('')}
            `;
        }

        function setupOrganization() {
            const radios = document.querySelectorAll('input[name="organization"]');
            const weekField = document.getElementById('org-week-field');
            const unitField = document.getElementById('org-unit-field');
            const hint = document.getElementById('org-hint');
            const apply = (value) => {
                weekField.hidden = value !== 'week';
                unitField.hidden = value !== 'unit';
                if (value === 'week') hint.textContent = 'Materials are shown to students grouped under this week.';
                else if (value === 'unit') hint.textContent = 'Materials are shown to students grouped under this unit / part.';
                else hint.textContent = 'Materials are shown to students as whole-semester content (no week grouping).';
            };
            radios.forEach(r => r.addEventListener('change', () => apply(r.value)));
            apply(document.querySelector('input[name="organization"]:checked')?.value || 'week');
        }

        async function loadCourses() {
            try {
                const response = await authFetch(`${API_BASE}/api/courses/`);
                const courses = await response.json();
                if (!Array.isArray(courses) || courses.length === 0) {
                    courseSelect.innerHTML = '<option value="" disabled>No courses available</option>';
                    return;
                }
                courseSelect.innerHTML = `
                    <option value="" disabled selected>Select a course</option>
                    ${courses.map(course => `
                        <option value="${course.id}">${course.title} (${course.code || 'No code'})</option>
                    `).join('')}
                `;
            } catch (err) {
                console.error('Error loading courses:', err);
                courseSelect.innerHTML = '<option value="" disabled>Unable to load courses</option>';
            }
        }

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const title = document.getElementById('title').value.trim();
            const description = document.getElementById('description').value.trim();
            const weekNumber = document.getElementById('week-number').value.trim();
            const unitLabel = document.getElementById('unit-label').value.trim();
            const organization = document.querySelector('input[name="organization"]:checked')?.value || 'week';
            const courseId = courseSelect.value;
            const semesterVal = document.getElementById('semester').value;
            const fileInput = document.getElementById('file');

            if (!title || !courseId || !academicYear.value || !semesterVal || !fileInput.files.length) {
                showToast('Select a course, academic year, semester, enter a title, and upload a file.', 'warning');
                return;
            }
            if (organization === 'week' && !weekNumber) {
                showToast('Enter the week number for this material.', 'warning');
                return;
            }
            if (organization === 'unit' && !unitLabel) {
                showToast('Enter a unit / part label for this material.', 'warning');
                return;
            }

            const semester = `${academicYear.value} - ${semesterVal}`;

            const formData = new FormData();
            formData.append('title', title);
            formData.append('description', description);
            formData.append('course_id', courseId);
            formData.append('semester', semester);
            if (organization === 'week') formData.append('week_number', weekNumber);
            if (organization === 'unit') formData.append('unit_label', unitLabel);
            formData.append('file', fileInput.files[0]);

            try {
                const response = await authFetch(`${API_BASE}/api/materials/upload`, {
                    method: 'POST',
                    headers: {},
                    body: formData,
                });
                const data = await response.json();
                if (response.ok) {
                    showToast('Material uploaded successfully.', 'success');
                    window.location.href = 'dashboard.html';
                } else {
                    showToast('Upload failed: ' + (data.detail || data.message || 'Unknown error'), 'error');
                }
            } catch (err) {
                console.error('Upload error:', err);
                showToast('Upload failed: Server connection error.', 'error');
            }
        });

        loadAcademicYears();
        setupOrganization();
        await loadCourses();
    });
    </script>
</body>
</html>
