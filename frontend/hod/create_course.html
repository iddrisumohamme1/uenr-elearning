<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Course - HOD</title>
    <link rel="stylesheet" href="../shared/variables.css">
    <link rel="stylesheet" href="../shared/reset.css">
    <link rel="stylesheet" href="../shared/typography.css">
    <link rel="stylesheet" href="../shared/responsive.css">
    <link rel="stylesheet" href="../shared/profile-popup.css">
    <link rel="stylesheet" href="../shared/spinner.css">
    <link rel="stylesheet" href="../shared/sidebar.css">
    <link rel="stylesheet" href="dashboard.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Outfit:wght@700;800&display=swap" rel="stylesheet">
    <script src="../shared/theme.js"></script>
</head>
<body>
    <div class="dashboard-container">
        <aside class="sidebar">
            <div class="sidebar-header"><span class="logo">🎓</span><span class="logo-text"> UENR Learn</span></div>
            <nav class="sidebar-nav">
                <a href="dashboard.html" class="nav-link"><span class="nav-icon">🏠</span><span class="nav-label"> Overview</span></a>
                <a href="department_analytics.html" class="nav-link"><span class="nav-icon">🏛️</span><span class="nav-label"> Dept Analytics</span></a>
                <a href="create_course.html" class="nav-link active"><span class="nav-icon">➕</span><span class="nav-label"> Add Course</span></a>
                <a href="upload.html" class="nav-link"><span class="nav-icon">📤</span><span class="nav-label"> Upload Material</span></a>
            </nav>
            <div class="sidebar-footer">
                <button id="logout-btn"><span class="nav-icon">🚪</span><span class="nav-label"> Logout</span></button>
            </div>
        </aside>

        <main class="main-content">
            <header class="top-bar">
                <h1>Add Department Course</h1>
                <p class="text-muted">Create a new course and assign it to a lecturer in your department.</p>
            </header>

            <form id="create-course-form" class="course-form">
                <div class="form-group">
                    <label class="form-label">Course Title</label>
                    <input type="text" id="course-title" class="form-input" placeholder="Introduction to Algorithms" required>
                </div>
                <div class="form-group">
                    <label class="form-label">Course Code</label>
                    <input type="text" id="course-code" class="form-input" placeholder="CSI 301" required>
                </div>
                <div class="form-group">
                    <label class="form-label">Description</label>
                    <textarea id="course-description" class="form-input" rows="4" placeholder="Describe the course learning outcomes..."></textarea>
                </div>
                <div class="form-group">
                    <label class="form-label">Assign Lecturer</label>
                    <select id="lecturer-select" class="form-input" required>
                        <option value="" disabled selected>Select a department lecturer</option>
                    </select>
                </div>
                <button type="submit" class="btn-auth">Create Course</button>
            </form>
        </main>
    </div>
    <script src="../shared/session.js"></script>
    <script src="../shared/profile-popup.js"></script>
    <script src="../shared/toast.js"></script>
    <script src="create_course.js"></script>
</body>
</html>
